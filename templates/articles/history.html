{{ define "article-content" }}
<div>
    <ul id="edit-history">
        {{ range .Data.Revisions }}
        <li>
            <time datetime="{{ .Published }}">{{ .PublishedDisplay }}</time>
            <a href="{{ .ActorURL }}">{{ .Actor }}</a>
            -
            <span>{{ .Summary }}</span>
            (
            <a href="{{ .URL }}">view</a>
            -
            <a
                href="{{ .URL }}/undo"
                fx-action="{{ .URL }}/undo"
                fx-method="POST"
                fx-target="#content"
                fx-swap="innerHTML">undo</a>
            )
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
