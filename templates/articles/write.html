{{ define "article-content" }}
<!-- TODO: re-render only article content when switching tabs -->

<form
    id="article-editor"
    action="{{ .Data.ActionURL }}"
    method="POST"
    fx-action="{{ .Data.ActionURL }}"
    fx-method="POST"
    fx-target="#content">
        <textarea id="article-text" class="text-edit" name="content">{{ .Data.Content }}</textarea>
        <footer>
            <input id="summary" name="summary" type="text">
            <div>
                <button
                    type="submit"
                    formaction="/preview"
                    fx-action="/preview"
                    fx-method="POST"
                    fx-target="#preview"
                    fx-swap="innerHTML">Preview</button>
                <button type="submit">Publish</button>
            </div>
        </footer>
</form>

<output id="preview" for="article-editor" form="article-editor"></output>
{{ end }}
