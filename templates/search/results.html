{{ define "content" }}
{{ block "page-tabs" . }}{{ end }}
{{ if eq (len .Data.Results) 0 }}
<div id="search-not-found">
    <h1>Nothing found.</h1>
    <p>No results were found for your search.</p>
</div>
{{ else }}
<ul id="search-results">
    {{ range .Data.Results }}
    <li>
        <a
            href="{{ .URL }}"
            fx-action="{{ .URL }}"
            fx-method="GET"
            fx-target="#content"
            fx-swap="innerHTML"
            >{{ .Title }}</a
        >
    </li>
    {{ end }}
</ul>
{{ end }} {{ end }}
