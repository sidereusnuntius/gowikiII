{{define "header"}}
<header id="main-header">
    <ul id="general-nav">
        <li>
            <a
                class="nav-item"
                href="/"
                fx-action="/"
                fx-target="#content"
                fx-method="GET"
                fx-swap="innerHTML"
                >Home</a
            >
        </li>
        <li>
            <a
                class="nav-item"
                href="/recent"
                fx-action="/recent"
                fx-target="#content"
                fx-method="GET"
                fx-swap="innerHTML"
                >Recent changes</a
            >
        </li>
        <li>
            <a
                class="nav-item"
                href="/media"
                fx-action="/media"
                fx-target="#content"
                fx-method="GET"
                fx-swap="innerHTML"
                >Media</a
            >
        </li>
    </ul>

    <form
        id="main-search"
        action="/search"
        fx-action="/search"
        fx-method="GET"
        fx-target="#content"
        fx-swap="innerHTML"
    >
        <input id="query" name="query" type="text" placeholder="Search" />
    </form>
    {{ block "auth-header" . }}{{ end }}
</header>
{{end}}
