{{define "header"}}
<header id="main-header">
    <ul id="general-nav">
        <li>
            <a
                class="nav-item"
                href="/"
                fx-action="/"
                fx-target="#content"
                fx-method="GET"
                fx-swap="innerHTML"
                >{{ T "Home" }}</a
            >
        </li>
        <li>
            <a
                class="nav-item"
                href="/recent"
                fx-action="/recent"
                fx-target="#content"
                fx-method="GET"
                fx-swap="innerHTML"
                >{{ T "RecentChanges" }}</a
            >
        </li>
        <li>
            <a
                class="nav-item"
                href="/media"
                fx-action="/media"
                fx-target="#content"
                fx-method="GET"
                fx-swap="innerHTML"
                >{{ T "Media" }}</a
            >
        </li>
    </ul>

    <form
        id="main-search"
        action="/search"
        fx-action="/search"
        fx-method="GET"
        fx-target="#content"
        fx-swap="innerHTML"
    >
        <input id="query" name="query" type="text" placeholder="{{ T `SearchPlaceholder` }}" />
    </form>
    {{ block "auth-header" . }}{{ end }}
</header>
{{end}}
