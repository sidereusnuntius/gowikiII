{{define "header"}}
<header>
    <nav id="main-header">
        <ul>
            <li>
                <a
                    href="/"
                    fx-action="/"
                    fx-target="#content"
                    fx-method="GET"
                    fx-swap="innerHTML"
                    >Home</a
                >
            </li>
        </ul>
        <form
            id="main-search"
            action="/search"
            fx-action="/search"
            fx-method="GET"
            fx-target="#content"
            fx-swap="innerHTML"
        >
            <input id="query" name="query" type="text" required />
            <button type="submit">Search</button>
        </form>
        <ul>
            {{ if .Authenticated }}
            <li><a href="/">{{.Session.User.Username}}</a></li>
            <li>
                <a
                    href="/logout"
                    fx-action="/logout"
                    fx-method="POST"
                    fx-target="#page-container"
                    fx-swap="innerHTML"
                    >Logout</a
                >
            </li>
            {{ else }}
            <li>
                <a
                    href="/login"
                    fx-action="/login"
                    fx-method="GET"
                    fx-target="#content"
                    fx-swap="innerHTML"
                    >Login</a
                >
            </li>
            <li>
                <a
                    href="/register"
                    fx-action="/register"
                    fx-method="GET"
                    fx-target="#content"
                    fx-swap="innerHTML"
                    >Register</a
                >
            </li>
            {{ end }}
        </ul>
    </nav>
</header>
{{end}}
