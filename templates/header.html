{{define "header"}}
<header>
    <nav id="main-header">
        <ul>
            <li><a href="/">Home</a></li>
        </ul>
        <ul>
            {{ if .Authenticated }}
            <li><a href="/">{{.Session.User.Username}}</a></li>
            <li><a
                href="/logout"
                fx-action="/logout"
                fx-method="POST"
                fx-target="#page-container"
                fx-swap="innerHTML"
                >Logout</a>
            </li>
            {{ else }}
            <li>
                <a
                    href="/login"
                    fx-action="/login"
                    fx-method="GET"
                    fx-target="#content"
                    fx-swap="innerHTML">Login</a>
            </li>
            <li>
                <a
                    href="/register"
                    fx-action="/register"
                    fx-method="GET"
                    fx-target="#content"
                    fx-swap="innerHTML">Register</a>
            </li>
            {{ end }}
        </ul>
    </nav>
</header>
{{end}}
